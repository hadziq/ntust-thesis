<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" data-ui-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0b5cad" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
  <script>
    /* Pick the UI language before first paint: saved choice, then browser language. */
    (function () {
      var lang = null;
      try { lang = localStorage.getItem('ntust-thesis-lang'); } catch (e) {}
      if (lang !== 'en' && lang !== 'zh') {
        lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
      }
      document.documentElement.setAttribute('data-ui-lang', lang);
      document.documentElement.classList.add('js');
    })();
  </script>
  {% seo %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body class="{{ page.body_class | default: 'doc' }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
